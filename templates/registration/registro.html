{% extends "base.html" %}
{% block titulo %}Crear cuenta{% endblock %}
{% block contenido %}
<div class="tarjeta auth p-4 mx-auto" style="max-width:420px">
  <h1 class="h4 mb-3">Crear cuenta</h1>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-naranja w-100">Registrarme</button>
  </form>
  <p class="mt-3 mb-0 small">¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
</div>
{% endblock %}
