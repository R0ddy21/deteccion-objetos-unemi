<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Detección de objetos{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --azul:#1b3247; --naranja:#f28c00; --gris:#eef2f6; }
    body { background:var(--gris); color:#1c2630; }
    .barra { background:var(--azul); }
    .barra .navbar-brand { color:#fff; font-weight:700; }
    .barra .nav-link { color:#c9d4df; }
    .barra .nav-link.active, .barra .nav-link:hover { color:#fff; border-bottom:2px solid var(--naranja); }
    .btn-naranja { background:var(--naranja); border-color:var(--naranja); color:#fff; font-weight:600; }
    .btn-naranja:hover { background:#d97d00; border-color:#d97d00; color:#fff; }
    .btn-azul { background:var(--azul); border-color:var(--azul); color:#fff; }
    .btn-azul:hover { background:#12222f; color:#fff; }
    .tarjeta { background:#fff; border:1px solid #d5dde5; border-radius:.5rem; }
    .auth input { display:block; width:100%; padding:.5rem .75rem; border:1px solid #ced4da; border-radius:.375rem; }
    .auth p { margin-bottom:.9rem; } .auth .helptext, .auth ul { font-size:.8rem; color:#6b7785; }
    .visor { background:#101820; border-radius:.5rem; aspect-ratio:4/3; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .visor img { width:100%; height:100%; object-fit:contain; }
    .contador { display:flex; justify-content:space-between; align-items:center; padding:.6rem .9rem; }
    .contador strong { font-size:1.5rem; color:var(--naranja); }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-md barra mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'deteccion' %}">Detección de objetos</a>
    {% if user.is_authenticated %}
    <div class="navbar-nav me-auto">
      <a class="nav-link {% if request.resolver_match.url_name == 'deteccion' %}active{% endif %}" href="{% url 'deteccion' %}">Detección</a>
      <a class="nav-link {% if request.resolver_match.url_name == 'historial' %}active{% endif %}" href="{% url 'historial' %}">Historial</a>
    </div>
    <form method="post" action="{% url 'logout' %}" class="d-flex align-items-center gap-3">
      {% csrf_token %}<span class="text-white-50">{{ user.username }}</span>
      <button class="btn btn-sm btn-outline-light">Cerrar sesión</button>
    </form>
    {% endif %}
  </div>
</nav>
<main class="container pb-5">{% block contenido %}{% endblock %}</main>
</body>
</html>
