{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="tarjeta auth p-4 mx-auto" style="max-width:420px">
  <h1 class="h4 mb-3">Iniciar sesión</h1>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-naranja w-100">Ingresar</button>
  </form>
  <p class="mt-3 mb-0 small">¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate</a></p>
</div>
{% endblock %}
